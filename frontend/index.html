<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Study Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<script src="script.js"></script>
<body>

<!-- 🔹 SECTION 1: LANDING -->
<section class="landing">
  <div class="overlay">
    <h1>AI Study Helper</h1>
    <p>Smart learning made simple</p>
    <a href="#study" class="start-btn">Let's Go</a>
  </div>
</section>

<!-- 🔹 SECTION 2: STUDY -->
<section class="study" id="study">
  <h1>Start Studying</h1>
  <br>
  <h2>Enter a topic :- </h2>
  <br>
  <div class="input-group">
    <input type="text" id="topicInput" placeholder="e.g. Breadth First Search">
    <button class="generate-btn" onclick="generateContent()">Generate</button>
  </div>
  <br><br>
 

  <div class="container">
    <div class="box" id="notes">
      <h3>📌 Short Notes</h3>
    </div>

    <div class="box" id="explanation">
      <h3>📖 Explanation</h3>
    </div>

    <div class="box" id="exam">
      <h3>📝 Exam Points</h3>
    </div>
    <div class="box" id="quiz">
      <h3>🧠 Quick Quiz</h3>
    </div>
  </div>
</section>

</body>
</html>
